name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc-14, clang-19]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build \
          libglfw3-dev libvulkan-dev libglm-dev libpthread-stubs0-dev \
          mesa-vulkan-drivers glslc \
          ${{ matrix.compiler }}

    - name: Configure with ASan
      run: |
        mkdir -p build && cd build
        cmake .. -GNinja \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
          -DBUILD_TESTS=ON

    - name: Build
      run: ninja -C build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure
